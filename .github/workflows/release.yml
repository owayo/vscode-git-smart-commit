name: Release VS Code Extension

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual release)"
        type: boolean
        default: false
      pre_release:
        description: "Publish as pre-release"
        type: boolean
        default: false

permissions:
  contents: read

# 本番のリリースは 1 件ずつ実行する。待機枠は 1 件なので、dry run と既定のブランチ以外からの
# 実行 (build の最初で失敗する) は実行ごとの別グループにして、待機中の本番リリースを押し出さない
concurrency:
  group: ${{ !inputs.dry_run && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'release' || format('release-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # 依存を入れて VSIX を作るジョブ。install スクリプトが動くので、push できるトークンを持たせない。
  # ビルドとパッケージ作成が成功してから、tag ジョブがリリースタグを公開する。
  build:
    name: Build VSIX
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      vsix: ${{ steps.vsix.outputs.filename }}
    steps:
      # 本番のリリースは既定のブランチからだけ出す (dry_run はどのブランチでも動く)
      - name: Check the branch
        if: ${{ !inputs.dry_run }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Run the release from ${DEFAULT_BRANCH} (this run is on ${GITHUB_REF})"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Node.js と pnpm の版は mise.toml が正
      - uses: jdx/mise-action@v5
        with:
          minimum_release_age: 14d
          cache: false

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          # 版は yy.m.counter (年は 2 桁、月はゼロ埋めしない、連番は 100 から)。
          # 採番は JST で切り、年と月は 1 回の date で取って月の境目でずれないようにする
          read -r YEAR MONTH <<< "$(TZ=Asia/Tokyo date '+%y %-m')"
          CURRENT=$(node -p 'require("./package.json").version')
          echo "Current version: ${CURRENT}"
          COUNTER=100
          if [[ "${CURRENT}" =~ ^([0-9]{2,4})\.([0-9]{1,2})\.([0-9]+)$ ]]; then
            if [ "${BASH_REMATCH[1]#20}" = "${YEAR}" ] && [ "${BASH_REMATCH[2]}" = "${MONTH}" ]; then
              COUNTER=$((BASH_REMATCH[3] + 1))
            fi
          fi
          VERSION="${YEAR}.${MONTH}.${COUNTER}"
          echo "New version: ${VERSION}"

          # package.json の version だけを書き換える。依存は入れず、version のスクリプトも走らせない
          npm version "${VERSION}" --no-git-tag-version --ignore-scripts

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm run compile

      # pre-release の印は VSIX の作成時に付ける。vsce publish --packagePath は印の無い VSIX を
      # --pre-release で公開すると失敗し、ovsx publish は作成済みの VSIX への --pre-release を無視する
      - name: Package extension
        env:
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: |
          set -euo pipefail
          if [ "${PRE_RELEASE}" = "true" ]; then
            pnpm exec vsce package --no-dependencies --pre-release
          else
            pnpm exec vsce package --no-dependencies
          fi

      - name: Dry run info
        if: ${{ inputs.dry_run }}
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          echo "🧪 Dry run mode - skipping commit, tag and publish"
          echo "Would release: ${TAG}"

      - name: Get VSIX filename
        id: vsix
        run: |
          VSIX_FILES=(./*.vsix)
          if [ "${#VSIX_FILES[@]}" -ne 1 ] || [ ! -f "${VSIX_FILES[0]}" ]; then
            echo "Expected exactly one VSIX package" >&2
            exit 1
          fi
          echo "filename=${VSIX_FILES[0]#./}" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  # 版のコミットとタグを push するジョブ。依存は入れず、版の書き換えに使う node だけを取得する
  tag:
    name: Commit version and tag
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 名前は mise.toml の [tools] のキーのまま書く
    env:
      MISE_DISABLE_TOOLS: "pnpm"
    steps:
      # build と同じコミットから版を上げる。その間に既定のブランチが進んでいれば push は拒否される
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: jdx/mise-action@v5
        with:
          minimum_release_age: 14d
          cache: false

      - name: Commit and tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # build で VSIX に入れた版と同じ値を書く
          npm version "${VERSION}" --no-git-tag-version --ignore-scripts
          git add package.json
          git commit -m "release: ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          # ブランチとタグをまとめて更新する。どちらかが拒否されれば、どちらも更新しない
          git push --atomic origin "HEAD:refs/heads/${DEFAULT_BRANCH}" "refs/tags/${TAG}"

  publish-vscode:
    name: Publish to VS Marketplace
    needs: [build, tag]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@v5
        with:
          minimum_release_age: 14d
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: vsix

      # トークンは vsce が読む VSCE_PAT で渡し、コマンドラインに載せない
      - name: Publish
        env:
          VSIX: ${{ needs.build.outputs.vsix }}
          PRE_RELEASE: ${{ inputs.pre_release }}
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${PRE_RELEASE}" = "true" ]; then
            pnpm exec vsce publish --packagePath "${VSIX}" --pre-release
          else
            pnpm exec vsce publish --packagePath "${VSIX}"
          fi

  publish-openvsx:
    name: Publish to Open VSX
    needs: [build, tag]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@v5
        with:
          minimum_release_age: 14d
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: vsix

      # pre-release かどうかは VSIX に記録済み。トークンは ovsx が読む OVSX_PAT で渡す
      - name: Publish
        env:
          VSIX: ${{ needs.build.outputs.vsix }}
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: pnpm exec ovsx publish "${VSIX}"

  github-release:
    name: GitHub Release
    needs: [build, tag, publish-vscode, publish-openvsx]
    if: ${{ !inputs.dry_run && !cancelled() && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          draft: false
          prerelease: ${{ inputs.pre_release }}
          files: ${{ needs.build.outputs.vsix }}
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Release summary
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VS_MARKETPLACE_RESULT: ${{ needs.publish-vscode.result }}
          OPEN_VSX_RESULT: ${{ needs.publish-openvsx.result }}
        run: |
          {
            echo "## Release ${TAG}"
            echo "- VS Marketplace: ${VS_MARKETPLACE_RESULT}"
            echo "- Open VSX: ${OPEN_VSX_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
