name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node.js と pnpm の版は mise.toml が正。mise 本体は公開から 14 日以上たった最新の版を、
      # 署名付きの checksum で確かめて入れる。
      - uses: jdx/mise-action@v5
        with:
          minimum_release_age: 14d
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Compile
        run: pnpm run compile

      - name: Package extension
        run: pnpm exec vsce package --no-dependencies
